name: Compatibility
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read

jobs:
  test:
    name: Rails ${{ matrix.rails }} / Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rails: "7.0"
            rails_file: "7_0"
            ruby: "3.1"
          - rails: "7.1"
            rails_file: "7_1"
            ruby: "3.1"
          - rails: "7.2"
            rails_file: "7_2"
            ruby: "3.1"
          - rails: "8.0"
            rails_file: "8_0"
            ruby: "3.2"
          - rails: "8.1"
            rails_file: "8_1"
            ruby: "3.3"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: otp_courier_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      OTP_COURIER_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/otp_courier_test
      BUNDLE_GEMFILE: gemfiles/rails_${{ matrix.rails_file }}.gemfile
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: false
      - name: Resolve and install
        run: |
          bundle lock --update
          bundle install --jobs 4 --retry 3
      - run: bundle exec rspec
      - run: bundle exec ruby script/check_package.rb
